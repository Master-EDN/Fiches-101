<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDN 101</title>
<style>
  :root{
    --bleu:#1b4b73;
    --bleu-clair:#eaf2f8;
    --rouge:#a33a3a;
    --rouge-clair:#fbeaea;
    --gris:#6b7480;
    --bordure:#dbe3ea;
  }
  *{ box-sizing:border-box; }
  body{
    font-family:"Segoe UI", Calibri, Arial, sans-serif;
    margin:0;
    padding:40px 24px 80px 24px;
    background:#fff;
    color:#222;
  }
  .wrap{ max-width:820px; margin:0 auto; }
  header{
    display:flex; align-items:center; gap:12px;
    margin-bottom:6px;
  }
  header svg{ color:var(--bleu); flex:none; }
  h1{
    font-size:26px; color:var(--bleu); margin:0;
    border-bottom:3px solid var(--bleu); padding-bottom:10px;
  }
  .subtitle{ color:var(--gris); font-size:14px; margin:14px 0 30px 0; }
  .search-row{ margin-bottom:22px; }
  #searchInput{
    width:100%; padding:10px 14px; font-size:14px;
    border:1px solid var(--bordure); border-radius:8px;
    background:#fbfcfe;
  }
  .fiche-card{
    display:flex; align-items:center; justify-content:space-between;
    gap:14px;
    padding:14px 16px;
    border:1px solid var(--bordure);
    border-radius:8px;
    margin-bottom:10px;
    text-decoration:none;
    color:#222;
    background:#fff;
    transition: border-color .15s ease, background .15s ease;
  }
  .fiche-card:hover{ border-color:var(--bleu); background:var(--bleu-clair); }
  .fiche-card .item-num{
    flex:none;
    font-size:11.5px; font-weight:800; color:var(--bleu);
    background:var(--bleu-clair);
    border:1px solid var(--bordure);
    border-radius:6px;
    padding:4px 9px;
    white-space:nowrap;
  }
  .fiche-card .item-title{ flex:1; font-size:14.5px; font-weight:600; }
  .fiche-card .item-specs{ flex:none; font-size:11.5px; color:var(--gris); }
  .empty-state{ color:var(--gris); font-size:13.5px; padding:20px 0; }
  footer{ margin-top:50px; text-align:center; color:#999; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
<header>
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
<h1>EDN 101</h1>
</header>
<p class="subtitle">Fiches de révision — EDN 2026</p>

<div class="search-row">
<input type="text" id="searchInput" placeholder="Rechercher une fiche (numéro, titre, spécialité)...">
</div>

<div id="fichesContainer"></div>

</div>

<script>
/* ===================== Liste des fiches =====================
   Ajoute une entrée ici à chaque nouvelle fiche créée. */
var FICHES = [
  {
    slug: 'item-151-meningites-meningo-encephalites-abces-cerebral.html',
    itemNum: '151',
    title: "Méningites, méningo-encéphalites, abcès cérébral",
    specialties: ['Infectiologie', 'Neurologie']
  }
];

function renderFiches(filter){
  var container = document.getElementById('fichesContainer');
  var q = (filter || '').trim().toLowerCase();

  var list = FICHES.filter(function(f){
    return !q ||
      f.itemNum.toLowerCase().indexOf(q) !== -1 ||
      f.title.toLowerCase().indexOf(q) !== -1 ||
      f.specialties.join(' ').toLowerCase().indexOf(q) !== -1;
  });

  if(list.length === 0){
    container.innerHTML = '<div class="empty-state">Aucune fiche ne correspond à cette recherche.</div>';
    return;
  }

  var html = '';
  list.forEach(function(f){
    html += '<a class="fiche-card" href="' + f.slug + '">' +
      '<span class="item-num">Item ' + f.itemNum + '</span>' +
      '<span class="item-title">' + f.title + '</span>' +
      '<span class="item-specs">' + f.specialties.join(' · ') + '</span>' +
      '</a>';
  });
  container.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', function(e){
  renderFiches(e.target.value);
});

renderFiches('');
</script>
</body>
</html>
